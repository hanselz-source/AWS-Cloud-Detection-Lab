name: pipeline for changing field names to kql
priority: 20
transformations:

  # direct: cloudtrail field to the sentinel column that holds the same value.

  - id: direct-columns
    type: field_name_mapping
    mapping:
      eventName: EventName
      eventSource: EventSource
      userIdentity.type: UserIdentityType
    rule_conditions:
      - type: logsource
        product: aws
        service: cloudtrail

  - id: prefix-mapping
    type: field_name_prefix_mapping
    mapping:
      requestParameters: 'parse_json(RequestParameters)'
      responseElements: 'parse_json(ResponseElements)'
      additionalEventData: 'parse_json(AdditionalEventData)'
    rule_conditions:
      - type: logsource
        product: aws
        service: cloudtrail

postprocessing:
  - type: embed
    prefix: "AWSCloudTrail\n| where "
    rule_conditions:
      - type: logsource
        product: aws
        service: cloudtrail
  - type: replace
    pattern: "'([^'\\s]+)'"
    replacement: "\\1"
