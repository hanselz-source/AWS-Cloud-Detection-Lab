on:
  push:
    branches: [master]
  workflow_dispatch:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: initialization
        uses: actions/checkout@v4
      - name: python setup
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: dependency installation
        run: pip install sigma-cli==3.1.0 pysigma==1.5.0 pysigma-backend-splunk==2.1.0 pysigma-backend-kusto==1.0.1
      - name: sigma linting, if fail then workflow fails
        run: sigma check -i -P rule.yml -x attacktag -x d3_fendtag -x filename_length -x duplicate_filename detections/
      - name: KQL conversion
        shell: bash
        run: |
          fail=0
          for rule in detections/*/rule.yml; do
            dir=$(dirname "$rule")
            name=$(basename "$dir")

            args=(-t kusto -p core_pipelines/kql_pipe.yml)

            if [ -f "$dir/pipeline.yml" ]; then
              args+=(-p "$dir/pipeline.yml")
            fi

            if ! err=$(sigma convert "${args[@]}" "$rule" 2>&1 >"$RUNNER_TEMP/q.kql"); then
              echo "ERROR $name  conversion failed"
              echo "$err" | grep -v "^Parsing Sigma rules$" | sed "s/^/        /"
              fail=2
            elif ! diff -u "$RUNNER_TEMP/q.kql" "expected/kusto/$name.kql" > "$RUNNER_TEMP/d.txt" 2>&1; then
              echo "FAIL  $name  query does not match expected/"
              sed "s/^/        /" "$RUNNER_TEMP/d.txt"
              fail=3
            else
              echo "ok    $name"
            fi
          done
          exit $fail
      - name: SPL conversion
        shell: bash
        run: |
          fail=0
          for rule in detections/*/rule.yml; do
            dir=$(dirname "$rule")
            name=$(basename "$dir")

            args=(-t splunk -p core_pipelines/spl_pipe.yml)

            if [ -f "$dir/pipeline.yml" ]; then
              args+=(-p "$dir/pipeline.yml")
            fi

            if ! err=$(sigma convert "${args[@]}" "$rule" 2>&1 >"$RUNNER_TEMP/q.spl"); then
              echo "ERROR $name  conversion failed"
              echo "$err" | grep -v "^Parsing Sigma rules$" | sed "s/^/        /"
              fail=2
            elif ! diff -u "$RUNNER_TEMP/q.spl" "expected/splunk/$name.spl" > "$RUNNER_TEMP/d.txt" 2>&1; then
              echo "FAIL  $name  query does not match expected/"
              sed "s/^/        /" "$RUNNER_TEMP/d.txt"
              fail=3
            else
              echo "ok    $name"
            fi
          done
          exit $fail
      - name: converted-query fixture tests
        shell: bash
        run: |
          fail=0
          for target in kusto splunk; do
            for rule in detections/*/rule.yml; do
              dir=$(dirname "$rule")
              name=$(basename "$dir")

              if [ "$target" = kusto ]; then
                args=(-t kusto -p core_pipelines/kql_pipe.yml)
                backend=kusto
              else
                args=(-t splunk -p core_pipelines/spl_pipe.yml)
                backend=splunk
              fi

              if [ -f "$dir/pipeline.yml" ]; then
                args+=(-p "$dir/pipeline.yml")
              fi

              query="$RUNNER_TEMP/$backend-$name.query"
              error="$RUNNER_TEMP/$backend-$name.error"
              if ! sigma convert "${args[@]}" "$rule" >"$query" 2>"$error"; then
                echo "ERROR $backend/$name  conversion failed"
                sed "s/^/        /" "$error"
                fail=2
                continue
              fi

              for fixture in true-positive true-negative; do
                if [ "$fixture" = true-positive ]; then
                  expectation=tp
                else
                  expectation=tn
                fi

                if ! python scripts/evaluate_query_fixtures.py \
                    --backend "$backend" \
                    --query "$query" \
                    --fixture "$dir/test/$fixture.json" \
                    --expect "$expectation"; then
                  fail=4
                fi
              done
            done
          done
          exit $fail

  iac-security:
    name: IaC security
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: initialization
        uses: actions/checkout@v4
      - name: Checkov Terraform scan
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          bridgecrew/checkov@sha256:0f169d3d9a5c6666da223253ce4d9f8c3f184e6542ce8328523d03343788a578
          --directory /repo/terraform --framework terraform --output cli --quiet
      - name: Trivy Terraform scan
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/repo:ro"
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          config --exit-code 1 --severity HIGH,CRITICAL /repo/terraform
